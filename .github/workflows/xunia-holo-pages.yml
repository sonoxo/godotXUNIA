name: XUNIA HOLO Pages

on:
  push:
    branches: [master]
    paths:
      - 'xunia_holo/index.html'
      - '.github/workflows/xunia-holo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xunia-holo-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HOLO only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xunia_holo
          sparse-checkout-cone-mode: false

      - name: Enable GitHub Pages for Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          CODE=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API")
          if [ "$CODE" = "404" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" \
              -d '{"build_type":"workflow"}' >/tmp/pages-enable.json
          elif [ "$CODE" = "200" ]; then
            curl -fsS -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" \
              -d '{"build_type":"workflow"}' >/tmp/pages-enable.json
          else
            cat /tmp/pages.json
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble standalone site
        run: |
          rm -rf _site
          mkdir -p _site
          cp xunia_holo/index.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q 'XUNIA // HOLO BATTLESPACE' _site/index.html
          grep -q 'three@0.160.0/build/three.module.js' _site/index.html
          grep -q 'OrbitControls.js' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
