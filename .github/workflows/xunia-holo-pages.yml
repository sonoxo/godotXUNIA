name: XUNIA HOLO Pages

on:
  push:
    branches: [master]
    paths:
      - 'xunia_holo/index.html'
      - '.github/workflows/xunia-holo-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xunia-holo-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate HOLO
        run: |
          set -euo pipefail
          test -s xunia_holo/index.html
          grep -q 'XUNIA // HOLO BATTLESPACE' xunia_holo/index.html
          grep -q 'three@0.160.0/build/three.module.js' xunia_holo/index.html
          grep -q 'OrbitControls.js' xunia_holo/index.html

      - name: Publish root site to gh-pages
        run: |
          set -euo pipefail
          cp xunia_holo/index.html /tmp/xunia-holo-index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages
          git switch gh-pages
          cp /tmp/xunia-holo-index.html index.html
          touch .nojekyll
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo 'HOLO Pages content already current.'
          else
            git commit -m 'Deploy XUNIA HOLO live site'
            git push origin gh-pages
          fi
