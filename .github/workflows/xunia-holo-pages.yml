name: XUNIA HOLO Pages

on:
  push:
    branches: [master]
    paths:
      - 'xunia_holo/index.html'
      - '.github/workflows/xunia-holo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: xunia-holo-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HOLO only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            xunia_holo
          sparse-checkout-cone-mode: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble standalone site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp xunia_holo/index.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q 'XUNIA // HOLO BATTLESPACE' _site/index.html
          grep -q 'three@0.160.0/build/three.module.js' _site/index.html
          grep -q 'OrbitControls.js' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
