name: XUNIA HOLO Battlefield

on:
  push:
    branches: [master, feature/xunia-holo-battlefield]
    paths:
      - 'xunia_holo/index.html'
      - '.github/workflows/xunia-holo-battlefield.yml'
  pull_request:
    paths:
      - 'xunia_holo/index.html'
      - '.github/workflows/xunia-holo-battlefield.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate single-file contract
        run: |
          test -s xunia_holo/index.html
          grep -q '<script type="importmap">' xunia_holo/index.html
          grep -q 'three@0.160.0/build/three.module.js' xunia_holo/index.html
          grep -q 'OrbitControls.js' xunia_holo/index.html
          grep -q 'function findPath' xunia_holo/index.html
          grep -q 'function createContours' xunia_holo/index.html
          grep -q 'function artilleryStrike' xunia_holo/index.html
          grep -q 'class SimUnit' xunia_holo/index.html
          grep -q 'LineDashedMaterial' xunia_holo/index.html
          grep -q 'ARTILLERY TARGET MODE' xunia_holo/index.html
          grep -q 'GRID + CONTOUR TELEMETRY' xunia_holo/index.html

      - name: Extract and syntax-check ES module
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('xunia_holo/index.html').read_text(encoding='utf-8')
          modules = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
          assert len(modules) == 1, f'expected one inline module, got {len(modules)}'
          Path('/tmp/xunia-holo.mjs').write_text(modules[0], encoding='utf-8')
          PY
          node --check /tmp/xunia-holo.mjs

      - name: Verify CDN assets resolve
        run: |
          curl -fsSI https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js >/dev/null
          curl -fsSI https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js >/dev/null

      - name: Static HTTP smoke test
        run: |
          python3 -m http.server 8080 --directory xunia_holo >/tmp/xunia-holo-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/ >/tmp/holo.html && break
            sleep 0.2
          done
          grep -q 'XUNIA // HOLO BATTLESPACE' /tmp/holo.html
          grep -q 'SYNTHETIC TACTICAL TRAINING SANDBOX' /tmp/holo.html
